<!DOCTYPE html>
<html>
<body style="font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f4f4f5; padding: 24px;">
<div style="max-width: 480px; margin: 0 auto; background: white; border-radius: 8px; padding: 32px;">
  <h2 style="margin: 0 0 16px; font-size: 18px; color: #16a34a;">Booking Approved!</h2>
  <p style="color: #52525b; line-height: 1.6;">Hi {{ first_name }},</p>
  <p style="color: #52525b; line-height: 1.6;">Great news! Your booking <strong>{{ booking_number }}</strong> for <strong>{{ vehicle_name }}</strong> has been approved.</p>
  <table style="width: 100%; border-collapse: collapse; margin: 16px 0;">
    <tr><td style="padding: 8px 0; color: #a1a1aa;">Dates</td><td style="color: #18181b;">{{ pickup_date }} – {{ return_date }}</td></tr>
    <tr><td style="padding: 8px 0; color: #a1a1aa;">Total</td><td style="color: #18181b;">₱{{ estimated_total }}</td></tr>
  </table>
  <p style="color: #52525b; line-height: 1.6;">Please complete your payment to confirm the booking.</p>
  <a href="{{ frontend_url }}/transactions/{{ booking.id }}" style="display: inline-block; background: #18181b; color: white; padding: 12px 24px; border-radius: 6px; text-decoration: none; margin-top: 8px;">Pay Now</a>
  <p style="color: #a1a1aa; font-size: 13px; margin-top: 24px;">– Car Rental Team</p>
</div>
</body>
</html>
